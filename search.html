    }
  }

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:    #22c55e;
      --green-d:  #4ade80;
      --green-bg: rgba(34,197,94,0.10);
      --bg:       #0a0a0f;
      --surface:  #111118;
      --lift:     #18181f;
      --border:   rgba(255,255,255,0.08);
      --border2:  rgba(255,255,255,0.04);
      --text:     #ececf1;
      --muted:    rgba(236,236,241,0.44);
      --dim:      rgba(236,236,241,0.22);
      --accent:   #6366f1;
      --px:       clamp(16px, 5vw, 80px);
    }

    html { background: var(--bg); }
    body {
      background: var(--bg); color: var(--text);
      font-family: "SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,sans-serif;
      min-height: 100dvh; -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 0; background: transparent; }
    [hidden] { display: none !important; }

    /* ── Shell ─────────────────────────────────────────────────────────────── */
    .qs-shell { width: 100%; padding-bottom: 72px; min-height: 100dvh; }
    @media (min-width: 900px) {
      .qs-shell {
        display: grid;
        grid-template-columns: 280px 1fr;
        grid-template-areas: "header header" "sidebar main";
        padding-bottom: 0;
      }
    }
    @media (min-width: 1200px) { .qs-shell { grid-template-columns: 320px 1fr; } }
    @media (min-width: 1600px) { .qs-shell { grid-template-columns: 360px 1fr; } }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .qs-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--px); height: 60px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200; grid-area: header;
    }
    .qs-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .qs-logo-mark { width: 26px; height: 26px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .qs-logo-mark img { width:100%; height:100%; display:block; object-fit:cover; }
    .qs-logo-text { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
    .qs-header-cta {
      font-size: 12px; font-weight: 700; color: var(--bg);
      text-decoration: none; padding: 8px 16px;
      background: var(--text); border-radius: 7px;
      transition: opacity .12s; letter-spacing: -0.1px;
    }
    .qs-header-cta:hover { opacity: .85; }

    /* ── Sidebar ───────────────────────────────────────────────────────────── */
    @media (min-width: 900px) {
      .qs-sidebar {
        grid-area: sidebar; border-right: 1px solid var(--border);
        padding: 32px 28px; position: sticky; top: 60px;
        height: calc(100dvh - 60px); overflow-y: auto; scrollbar-width: none;
        display: flex; flex-direction: column; gap: 28px;
      }
      .qs-sidebar::-webkit-scrollbar { display: none; }
    }
    @media (max-width: 899px) { .qs-sidebar { border-bottom: 1px solid var(--border); padding-bottom: 4px; } }

    /* ── Search bar ────────────────────────────────────────────────────────── */
    .search-wrap { padding: 16px var(--px) 12px; }
    @media (min-width: 900px) { .search-wrap { padding: 0; } }
    .search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 0 14px; transition: border-color .12s;
    }
    .search-box:focus-within { border-color: rgba(34,197,94,0.55); box-shadow: 0 0 0 3px rgba(34,197,94,0.08); }
    .search-icon { font-size: 15px; color: var(--muted); flex-shrink: 0; }
    #qs-search-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 14px; padding: 13px 0; font-family: inherit;
    }
    #qs-search-input::placeholder { color: var(--muted); }
    #qs-clear-btn {
      display: none; background: none; border: none;
      color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; line-height: 1;
    }

    /* ── Category tiles ────────────────────────────────────────────────────── */
    .search-cats-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.8px;
      text-transform: uppercase; color: var(--dim); display: none;
    }
    @media (min-width: 900px) { .search-cats-label { display: block; } }

    .cat-grid {
      display: flex; flex-wrap: nowrap; overflow-x: auto;
      gap: 7px; padding: 4px var(--px) 14px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    }
    .cat-grid::-webkit-scrollbar { display: none; }
    @media (min-width: 900px) { .cat-grid { display: flex; flex-direction: column; gap: 2px; padding: 0; overflow: visible; } }

    .cat-tile {
      flex: 0 0 auto; scroll-snap-align: start;
      display: flex; flex-direction: row; align-items: center;
      gap: 7px; padding: 8px 14px 8px 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; cursor: pointer; text-decoration: none;
      transition: background .12s, border-color .12s; white-space: nowrap;
    }
    @media (min-width: 900px) {
      .cat-tile { flex: unset; flex-direction: row; gap: 12px; padding: 10px 14px; border-radius: 8px; background: transparent; border-color: transparent; }
    }
    .cat-tile:hover, .cat-tile.active { background: var(--lift); border-color: var(--border); }
    .cat-tile.active .cat-emoji { background: var(--green-bg); border-color: rgba(34,197,94,0.3); }
    .cat-emoji {
      width: 24px; height: 24px; border-radius: 6px;
      background: var(--lift); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
      transition: background .12s, border-color .12s;
    }
    @media (min-width: 900px) { .cat-emoji { width: 28px; height: 28px; font-size: 14px; } }
    .cat-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1; }
    @media (min-width: 900px) { .cat-name { font-size: 13px; } }

    /* ── Main column ───────────────────────────────────────────────────────── */
    @media (min-width: 900px) {
      .qs-main { grid-area: main; padding: 40px clamp(32px, 4vw, 72px); min-height: calc(100dvh - 60px); }
    }

    /* ── Tab bar (shared across all browse states) ─────────────────────────── */
    #main-tab-bar {
      display: flex; align-items: stretch; gap: 0;
      padding: 0 var(--px);
      border-bottom: 1px solid var(--border);
    }
    @media (min-width: 900px) { #main-tab-bar { padding: 0; } }

    .landing-tab {
      flex: 1;
      font-size: 13px; font-weight: 700; font-family: inherit;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 15px 0; cursor: pointer;
      text-align: center;
      transition: color .15s, border-color .15s;
      min-height: 48px; line-height: 1; white-space: nowrap;
      letter-spacing: -0.1px;
      margin-bottom: -1px;
    }
    .landing-tab:hover  { color: var(--text); }
    .landing-tab:active { opacity: 0.7; }
    .landing-tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
      font-weight: 800;
    }

    /* ── Content panels ────────────────────────────────────────────────────── */
    #panel-products,
    #panel-stores {
      padding: 16px var(--px) 0;
    }
    @media (min-width: 900px) {
      #panel-products,
      #panel-stores { padding: 20px 0 0; }
    }

    /* ── Results heading ───────────────────────────────────────────────────── */
    .results-heading { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .results-heading strong { color: var(--text); }

    /* ── Stores grid ───────────────────────────────────────────────────────── */
    #stores-grid { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 640px) {
      #stores-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    @media (min-width: 1100px) {
      #stores-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Inline spinner for stores panel lazy-load */
    .panel-loading {
      padding: 40px 20px; display: flex;
      flex-direction: column; align-items: center; gap: 12px;
    }

    /* ── Product grid ──────────────────────────────────────────────────────── */
    .product-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
    }
    @media (min-width: 480px) { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
    @media (min-width: 900px) { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
    @media (min-width: 1300px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ── Product card ──────────────────────────────────────────────────────── */
    .product-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; cursor: pointer;
      transition: border-color .15s, transform .15s;
      display: flex; flex-direction: column;
      text-decoration: none;
    }
    .product-card:hover { border-color: rgba(34,197,94,0.3); transform: translateY(-2px); }
    .product-card:active { transform: scale(0.975) translateY(0) !important; background: var(--lift); }

    /* Image zone */
    .pc-image {
      width: 100%; aspect-ratio: 1 / 1;
      background: var(--lift); overflow: hidden; position: relative;
      flex-shrink: 0;
    }
    .pc-image img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity .2s;
    }
    .pc-image img[data-loading] { opacity: 0; }
    .pc-image-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      background: linear-gradient(145deg, var(--lift) 0%, #0e0e16 100%);
      font-size: clamp(32px, 7vw, 44px);
    }
    .pc-image-placeholder span {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--dim); opacity: 0.7;
    }

    /* ── Product detail image ────────────────────────────────────────────── */
    .detail-image-wrap {
      width: 100%; aspect-ratio: 4/3; max-height: 300px;
      border-radius: 14px; overflow: hidden; margin-bottom: 20px;
      background: var(--lift); border: 1px solid var(--border);
      position: relative;
    }
    .detail-image-wrap img { width:100%; height:100%; object-fit:cover; display:block; transition: opacity .22s; }
    .detail-image-wrap img[data-loading] { opacity: 0; }
    @media (min-width: 900px) { .detail-image-wrap { max-height: 340px; } }

    /* Shimmer */
    .pc-image-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--lift) 25%, var(--surface) 50%, var(--lift) 75%);
      background-size: 200% 100%;
      animation: skel-shimmer 1.4s ease-in-out infinite;
      pointer-events: none;
    }

    /* Text zone */
    .pc-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .pc-category {
      font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--dim);
    }
    .pc-name {
      font-size: 12px; font-weight: 700; color: var(--text);
      line-height: 1.35; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pc-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 4px; }
    .pc-price { font-size: 13px; font-weight: 800; color: var(--green); letter-spacing: -0.3px; }
    .pc-stores {
      font-size: 10px; font-weight: 700; color: var(--dim);
      background: var(--border2); padding: 2px 6px; border-radius: 4px;
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── Loading state (full-page — product detail only) ───────────────────── */
    #state-loading {
      padding: 80px 20px; display: flex;
      flex-direction: column; align-items: center; gap: 14px;
    }
    .qs-spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 13px; color: var(--muted); }

    /* ── Product detail ────────────────────────────────────────────────────── */
    #state-detail { padding: 0 var(--px); }
    @media (min-width: 900px) { #state-detail { padding: 0; max-width: 640px; } }

    /* Back button — pill with context label, intentional touch target */
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: var(--dim);
      cursor: pointer; padding: 7px 14px 7px 10px; margin: 10px 0 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      transition: color .12s, border-color .12s; min-height: 36px;
    }
    .detail-back:hover  { color: var(--text); border-color: rgba(255,255,255,0.18); }
    .detail-back:active { color: var(--text); transform: scale(0.97); }

    .detail-name { font-size: clamp(24px, 3vw, 36px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 6px; }
    .detail-meta { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .detail-meta .dm-stores { color: var(--green); font-weight: 700; }
    .detail-meta .dm-price  { color: var(--text);  font-weight: 700; }

    /* Section label */
    .detail-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--dim); margin-bottom: 14px;
    }
    .vendor-list { display: flex; flex-direction: column; gap: 10px; }

    /* Vendor card — column layout with full-width CTA at bottom */
    .vendor-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 16px 14px;
      display: flex; flex-direction: column; gap: 12px; transition: border-color .12s;
    }
    .vendor-card:hover   { border-color: rgba(34,197,94,0.25); }
    .vendor-card.best-price { border-color: rgba(34,197,94,0.35); }

    /* Top row: avatar + info + price */
    .vc-row { display: flex; align-items: flex-start; gap: 13px; }

    /* Avatar — shows logo img if available, initial letter if not */
    .vc-avatar {
      width: 42px; height: 42px; background: var(--lift);
      border: 1px solid var(--border); border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; color: var(--green); text-transform: uppercase;
      overflow: hidden;
    }
    .vc-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .vc-info { flex: 1; min-width: 0; padding-top: 1px; }
    .vc-store  { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Tagline — 2 lines max, breaks at word boundary */
    .vc-tagline {
      font-size: 12px; color: var(--muted); margin-top: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .vc-best-badge { font-size: 9.5px; font-weight: 700; color: var(--green); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
    .vc-price { font-size: 17px; font-weight: 800; color: var(--green); flex-shrink: 0; text-align: right; padding-top: 1px; }

    /* Full-width Order CTA — the primary conversion action */
    .vc-cta {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; min-height: 46px; box-sizing: border-box;
      background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--green);
      text-decoration: none; transition: background .12s, border-color .12s, transform .1s;
      letter-spacing: 0.01em;
    }
    .vc-cta:hover  { background: rgba(34,197,94,0.13); border-color: rgba(34,197,94,0.5); }
    .vc-cta:active { transform: scale(0.99); }

    /* ── Store card (used in stores panel) ─────────────────────────────────── */
    .store-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; transition: border-color .12s; cursor: pointer;
    }
    .store-card:hover { border-color: rgba(34,197,94,0.25); }
    .store-card:active { transform: scale(0.99); }
    .sc-avatar {
      width: 42px; height: 42px; background: var(--lift);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; color: var(--green); flex-shrink: 0; text-transform: uppercase;
      overflow: hidden;
    }
    .sc-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .sc-info { flex: 1; min-width: 0; }
    .sc-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-tagline { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .sc-location { font-size: 11px; color: var(--dim); }
    .sc-delivery { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-bg); padding: 2px 7px; border-radius: 4px; }
    .sc-count { font-size: 11px; color: var(--dim); }
    .sc-action {
      font-size: 11px; font-weight: 700; color: var(--text);
      background: var(--lift); border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 12px; white-space: nowrap; flex-shrink: 0;
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; transition: border-color .12s;
    }
    .sc-action:hover { border-color: var(--text); }

    /* ── Empty / error states ──────────────────────────────────────────────── */
    .empty-state { padding: 64px 20px; text-align: center; }
    .empty-state .es-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: var(--muted); line-height: 1.6; }

    /* ── Skeleton ──────────────────────────────────────────────────────────── */
    @keyframes skel-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skel {
      background: linear-gradient(90deg, var(--surface) 25%, var(--lift) 50%, var(--surface) 75%);
      background-size: 200% 100%; animation: skel-shimmer 1.4s ease-in-out infinite; border-radius: 6px;
    }
    .skel-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .skel-card-img { width: 100%; aspect-ratio: 1/1; }
    .skel-card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

    /* ── Load more button ──────────────────────────────────────────────────── */
    .load-more-btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; margin: 20px 0 8px;
      padding: 13px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .12s, border-color .12s;
      min-height: 44px;
    }
    .load-more-btn:hover { background: var(--lift); border-color: rgba(255,255,255,0.14); }
    .load-more-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── All Stores cat tile accent ─────────────────────────────────────────── */
    .cat-tile--stores { border-color: rgba(34,197,94,0.2); }
    .cat-tile--stores .cat-emoji { background: var(--green-bg); border-color: rgba(34,197,94,0.25); }
    .cat-tile--stores.active,
    .cat-tile--stores:hover { border-color: rgba(34,197,94,0.35); background: var(--green-bg); }

    /* ── Store Directory Card (SDC) ─────────────────────────────────────────── */
    .sdc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      text-decoration: none; cursor: pointer;
      display: flex; flex-direction: column;
      transition: border-color .15s, transform .15s;
    }
    .sdc:hover { border-color: rgba(34,197,94,0.25); }
    .sdc:active { transform: scale(0.99); }
    .sdc-header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px 12px;
    }
    .sdc-avatar {
      width: 44px; height: 44px; background: var(--lift);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: var(--green);
      flex-shrink: 0; text-transform: uppercase; overflow: hidden;
    }
    .sdc-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sdc-info { flex: 1; min-width: 0; }
    .sdc-name {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sdc-tagline {
      font-size: 12px; color: var(--muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sdc-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .sdc-location { font-size: 11px; color: var(--dim); }
    .sdc-delivery { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-bg); padding: 2px 7px; border-radius: 4px; }
    .sdc-count { font-size: 11px; color: var(--dim); }
    .sdc-action {
      font-size: 11px; font-weight: 700; color: var(--text);
      background: var(--lift); border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 12px; white-space: nowrap; flex-shrink: 0;
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      transition: border-color .12s;
    }
    .sdc-action:hover { border-color: var(--text); }
    .sdc-thumbs {
      display: flex; gap: 2px;
      border-top: 1px solid var(--border2);
    }
    .sdc-thumb {
      flex: 1; aspect-ratio: 1 / 1; min-width: 0;
      background: var(--lift); overflow: hidden;
    }
    .sdc-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity .18s;
    }
    .sdc-thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: var(--lift);
    }

    /* ── Touch targets ─────────────────────────────────────────────────────── */
    .cat-tile { min-height: 44px; }
    .detail-back { min-height: 44px; }
    #qs-clear-btn { min-width: 44px; min-height: 44px; }

    /* ── Page fade-in ──────────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: no-preference) { body { animation: qs-page-in 0.22s ease both; } }
    @keyframes qs-page-in { from { opacity: 0; } to { opacity: 1; } }

    /* ── Product detail slide-in ───────────────────────────────────────────── */
    /* Plays every time the detail panel is revealed — gives continuity between  */
    /* the card tap and the detail view regardless of network speed.             */
    @keyframes qs-detail-in {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    .qs-detail-enter { animation: qs-detail-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @media (prefers-reduced-motion: reduce) { .qs-detail-enter { animation: none; } }

    /* ── Retry button ──────────────────────────────────────────────────────── */
    .qs-retry-btn {
      margin-top: 12px; padding: 10px 24px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
      transition: border-color .12s;
    }
    .qs-retry-btn:hover { border-color: var(--green); color: var(--green); }

    /* ── Footer ────────────────────────────────────────────────────────────── */
    .qs-footer { margin-top: 64px; padding: 32px var(--px); border-top: 1px solid var(--border); text-align: center; }
    @media (min-width: 900px) { .qs-footer { grid-column: 1 / -1; } }
    .qs-footer p { font-size: 12px; color: var(--dim); line-height: 1.9; }
    .qs-footer a { color: var(--green); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="qs-shell">

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header class="qs-header">
  <a class="qs-logo" href="https://quickshopper.vercel.app">
    <div class="qs-logo-mark"><img src="pwa-192.png" alt="QuickShop"></div>
    <span class="qs-logo-text">QuickShop</span>
  </a>
  <a class="qs-header-cta" href="https://quickshopper.vercel.app">Sell on QuickShop →</a>
</header>

<!-- ── Sidebar: search + categories ────────────────────────────────────────── -->
<aside class="qs-sidebar">
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input
        id="qs-search-input"
        type="search"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Search products…"
        aria-label="Search products"
      >
      <button id="qs-clear-btn" aria-label="Clear search">✕</button>
    </div>
  </div>
  <div>
    <div class="search-cats-label">Categories</div>
    <div class="cat-grid" id="cat-grid">
      <a class="cat-tile cat-tile--stores" href="#" data-cat="__stores__"><span class="cat-emoji">🏪</span><span class="cat-name">All Stores</span></a>
      <a class="cat-tile" href="#" data-cat="Fragrance"><span class="cat-emoji">🌸</span><span class="cat-name">Fragrance</span></a>
      <a class="cat-tile" href="#" data-cat="Fashion"><span class="cat-emoji">👗</span><span class="cat-name">Fashion</span></a>
      <a class="cat-tile" href="#" data-cat="Shoes"><span class="cat-emoji">👟</span><span class="cat-name">Shoes</span></a>
      <a class="cat-tile" href="#" data-cat="Bags"><span class="cat-emoji">👜</span><span class="cat-name">Bags</span></a>
      <a class="cat-tile" href="#" data-cat="Beauty"><span class="cat-emoji">💄</span><span class="cat-name">Beauty</span></a>
      <a class="cat-tile" href="#" data-cat="Electronics"><span class="cat-emoji">📱</span><span class="cat-name">Electronics</span></a>
      <a class="cat-tile" href="#" data-cat="Food"><span class="cat-emoji">🍱</span><span class="cat-name">Food</span></a>
      <a class="cat-tile" href="#" data-cat="Home"><span class="cat-emoji">🏠</span><span class="cat-name">Home</span></a>
    </div>
  </div>
</aside>

<!-- ── Main content ──────────────────────────────────────────────────────────── -->
<main class="qs-main">

  <!--
    MAIN STATE
    ──────────
    Single unified state for all browse contexts:
    home · search results · category browse · all-stores directory
    The tab bar is always visible here; panels swap on tab click.
  -->
  <div id="state-main">

    <!-- Persistent tab bar -->
    <div id="main-tab-bar">
      <button class="landing-tab active" id="tab-products">Products</button>
      <button class="landing-tab"        id="tab-stores">Active Stores</button>
    </div>

    <!-- Products panel -->
    <div id="panel-products">
      <p class="results-heading" id="products-heading" hidden></p>
      <div class="product-grid" id="products-grid"></div>
      <button class="load-more-btn" id="load-more-btn" hidden>Load more products</button>
    </div>

    <!-- Stores panel (lazy-loaded on first tab switch) -->
    <div id="panel-stores" hidden>
      <p class="results-heading" id="stores-heading" hidden></p>
      <div id="stores-grid"></div>
    </div>

  </div>

  <!-- LOADING STATE (product detail only) -->
  <div id="state-loading" hidden>
    <div class="qs-spinner"></div>
    <span class="loading-label" id="loading-label">Loading…</span>
  </div>

  <!-- PRODUCT DETAIL STATE -->
  <div id="state-detail" hidden>
    <button class="detail-back" id="detail-back">← Back</button>
    <div class="detail-image-wrap" id="detail-image-wrap" hidden></div>
    <h1 class="detail-name" id="detail-name"></h1>
    <p class="detail-meta" id="detail-meta"></p>
    <div class="detail-section-label" id="detail-vendors-label"></div>
    <div class="vendor-list" id="vendor-list"></div>
  </div>

  <footer class="qs-footer">
    <p>
      Powered by <a href="https://quickshopper.vercel.app">QuickShop</a><br>
      Are you a vendor? <a href="https://quickshopper.vercel.app">Sell on QuickShop →</a>
    </p>
  </footer>

</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4" integrity="sha384-4eCDoMN/7A46qQ5Tj0rZ/D2VEolFGNIINDTLAcWZcvhkRSsvTfqNfaBMlRRoGEZ5" crossorigin="anonymous"></script>
<script src="supabase-config.js"></script>

<script>
(function () {
  'use strict';

  // Preconnect to Supabase as early as possible — warms DNS+TCP+TLS
  // before the first query fires. URL comes from supabase-config.js.
  (function () {
    var _url = window.__QS_SUPABASE && window.__QS_SUPABASE.url;
    if (!_url) return;
    var _pc = document.createElement('link');
    _pc.rel = 'preconnect'; _pc.href = _url; _pc.crossOrigin = 'anonymous';
    document.head.appendChild(_pc);
    var _pcd = document.createElement('link');
    _pcd.rel = 'dns-prefetch'; _pcd.href = _url;
    document.head.appendChild(_pcd);
  }());

  var sb = (window.__QS_SUPABASE && window.__QS_SUPABASE.client)
    ? window.__QS_SUPABASE.client : null;
  if (!sb) console.error('[QS Market] Supabase client not ready.');

  // ── DOM refs ──────────────────────────────────────────────────────────────
  var input           = document.getElementById('qs-search-input');
  var clearBtn        = document.getElementById('qs-clear-btn');
  var stateMain       = document.getElementById('state-main');
  var stateLoading    = document.getElementById('state-loading');
  var stateDetail     = document.getElementById('state-detail');
  var loadingLabel    = document.getElementById('loading-label');
  var tabProducts     = document.getElementById('tab-products');
  var tabStores       = document.getElementById('tab-stores');
  var panelProducts   = document.getElementById('panel-products');
  var panelStores     = document.getElementById('panel-stores');
  var productsHeading = document.getElementById('products-heading');
  var storesHeading   = document.getElementById('stores-heading');
  var productsGrid    = document.getElementById('products-grid');
  var storesGrid      = document.getElementById('stores-grid');
  var loadMoreBtn     = document.getElementById('load-more-btn');
  var catGrid         = document.getElementById('cat-grid');
  var detailBack      = document.getElementById('detail-back');
  var detailImageWrap = document.getElementById('detail-image-wrap');
  var detailName      = document.getElementById('detail-name');
  var detailMeta      = document.getElementById('detail-meta');
  var detailVLabel    = document.getElementById('detail-vendors-label');
  var vendorList      = document.getElementById('vendor-list');

  // ── App state ─────────────────────────────────────────────────────────────
  var _mode           = 'home';   // 'home' | 'search' | 'category'
  var _activeTab      = 'products';
  var _storesLoaded   = false;
  var _storesFetcher  = null;
  var _catName        = '';
  var _catOffset      = 0;
  var _CAT_PAGE       = 16;
  var _catHasMore     = false;
  var _recentOffset   = 0;
  var _RECENT_PAGE    = 16;
  var _lastQuery      = '';
  var _currentProduct = null;
  var _debounceTimer  = null;
  // Navigation token — incremented on every navigation action.
  // Every async function captures its seq at start and checks before
  // any DOM write. Mismatched seq = user navigated away — discard silently.
  var _navSeq         = 0;
  // Scroll memory — saved before opening product detail, restored on back.
  var _scrollY        = 0;
  var _memo           = new Map();
  var _prefetchCache  = new Map();

  // ── State machine ─────────────────────────────────────────────────────────
  function showState(name) {
    stateMain.hidden    = name !== 'main';
    stateLoading.hidden = name !== 'loading';
    stateDetail.hidden  = name !== 'detail';
    if (name === 'detail') {
      // Restart the slide-in animation each time detail is revealed
      stateDetail.classList.remove('qs-detail-enter');
      void stateDetail.offsetWidth; // force reflow to reset animation
      stateDetail.classList.add('qs-detail-enter');
    }
  }

  // ── Tab system ────────────────────────────────────────────────────────────
  // switchTab: toggle panels + lazy-load stores on first switch
  function switchTab(tab) {
    _activeTab = tab;
    tabProducts.classList.toggle('active', tab === 'products');
    tabStores.classList.toggle('active',   tab === 'stores');
    panelProducts.hidden = tab !== 'products';
    panelStores.hidden   = tab !== 'stores';

    // Lazy-load the stores panel the first time it's opened
    if (tab === 'stores' && !_storesLoaded && _storesFetcher) {
      _storesLoaded = true;
      _storesFetcher();
    }
  }

  // Update the tab bar labels for the current context
  // Products: always "Products"
  // Stores label changes per mode:
  //   home / all-stores  → "Active Stores"
  //   category browse    → "Stores"   (heading inside panel gives full context)
  //   search results     → "Stores"
  function setTabLabels(storesLabel) {
    tabStores.textContent = storesLabel || 'Stores';
  }

  // ── URL management ────────────────────────────────────────────────────────
  function getParams() { return new URLSearchParams(window.location.search); }

  function navigate(params, replace) {
    var url = params.toString()
      ? window.location.pathname + '?' + params.toString()
      : window.location.pathname;
    if (replace) history.replaceState(null, '', url);
    else         history.pushState(null, '', url);
    updateSEO(params);
  }

  function updateSEO(params) {
    var q = params.get('q'), product = params.get('product'), cat = params.get('cat');
    var title, desc, canonical;
    if (product && _currentProduct) {
      title     = _currentProduct.display_name + ' — Buy From QuickShop Vendors';
      desc      = 'Compare prices for ' + _currentProduct.display_name + ' across vendors on QuickShop.';
      canonical = 'https://quickshopper.vercel.app/search.html?product=' + product;
    } else if (q) {
      title     = '"' + q + '" — QuickShop Product Search';
      desc      = 'Find vendors selling ' + q + ' on QuickShop. Compare prices and order on WhatsApp.';
      canonical = 'https://quickshopper.vercel.app/search.html?q=' + encodeURIComponent(q);
    } else if (cat) {
      title     = cat + ' — QuickShop Vendors';
      desc      = 'Browse ' + cat + ' products from QuickShop vendors.';
      canonical = 'https://quickshopper.vercel.app/search.html?cat=' + encodeURIComponent(cat);
    } else {
      title     = 'QuickShop — Find Products From Vendors Near You';
      desc      = 'Search perfumes, fashion, electronics and more from real vendors on QuickShop.';
      canonical = 'https://quickshopper.vercel.app/search.html';
    }
    document.title = title;
    var m = document.querySelector('meta[name="description"]');
    if (m) m.content = desc;
    var c = document.querySelector('link[rel="canonical"]');
    if (c) c.href = canonical;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmt(price) {
    if (!price && price !== 0) return '';
    return '₦' + Number(price).toLocaleString('en-NG');
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Image transform ───────────────────────────────────────────────────────
  // Supabase Storage image resizing requires a Pro plan.
  // Set _IMG_TRANSFORM = true after upgrading to enable server-side resizing.
  // On free tier this is a no-op — original URLs are served unchanged.
  var _IMG_TRANSFORM = false;
  function imgTransform(url, width, quality) {
    if (!url || typeof url !== 'string') return url || '';
    if (!_IMG_TRANSFORM) return url;
    if (!url.includes('/storage/v1/object/public/')) return url;
    return url.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/')
      + '?width=' + width + '&quality=' + quality + '&resize=cover';
  }

  // ── Skeleton vendor card ──────────────────────────────────────────────────
  // Rendered immediately in openProduct so the user sees layout before data.
  function renderSkeletonVendorCard() {
    var div = document.createElement('div');
    div.className = 'vendor-card vc-skel';
    div.innerHTML =
      '<div class="vc-row">' +
        '<div class="vc-avatar skel"></div>' +
        '<div class="vc-info">' +
          '<div class="skel" style="height:12px;width:55%;margin-bottom:7px;border-radius:4px"></div>' +
          '<div class="skel" style="height:10px;width:80%;border-radius:4px"></div>' +
        '</div>' +
        '<div class="skel" style="width:58px;height:20px;border-radius:4px;flex-shrink:0"></div>' +
      '</div>' +
      '<div class="skel" style="height:46px;border-radius:8px;margin-top:12px"></div>';
    return div;
  }

  // ── Skeleton helpers ──────────────────────────────────────────────────────
  function renderSkeletonGrid(container, count) {
    container.innerHTML = '';
    for (var i = 0; i < count; i++) {
      var card = document.createElement('div');
      card.className = 'skel-card';
      var img  = document.createElement('div');
      img.className = 'skel-card-img skel';
      var body = document.createElement('div');
      body.className = 'skel-card-body';
      body.innerHTML =
        '<div class="skel" style="height:10px;width:45%"></div>' +
        '<div class="skel" style="height:14px;width:85%"></div>' +
        '<div class="skel" style="height:12px;width:55%"></div>';
      card.appendChild(img);
      card.appendChild(body);
      container.appendChild(card);
    }
  }

  function renderStorePanelLoading() {
    storesGrid.innerHTML =
      '<div class="panel-loading">' +
      '<div class="qs-spinner"></div>' +
      '<span class="loading-label">Loading stores…</span>' +
      '</div>';
  }

  // ── Batch-fetch listing stats ─────────────────────────────────────────────
  // ── Prefetch vendor listings on touchstart ────────────────────────────────
  // Starts the qs_vendor_listings fetch ~100-200ms before the tap registers.
  // On most Nigerian 4G connections the data arrives before openProduct runs,
  // eliminating the loading state entirely.  The same Promise is reused if
  // the user taps after touchstart — never fetches twice for the same item.
  function _prefetchProduct(item) {
    if (!sb || _prefetchCache.has(item.id)) return;
    var p = new Promise(function (resolve, reject) {
      sb.from('qs_vendor_listings').select('*')
        .eq('canonical_id', item.id)
        .order('price', { ascending: true })
        .then(resolve, reject);
    });
    _prefetchCache.set(item.id, p);
    // Cap at 60 entries — one full home-page load — then evict oldest
    if (_prefetchCache.size > 60) {
      _prefetchCache.delete(_prefetchCache.keys().next().value);
    }
  }

  // ── Render product card ───────────────────────────────────────────────────
  var CAT_EMOJI = {
    fragrance:'🌸', fashion:'👗', shoes:'👟', bags:'👜',
    beauty:'💄', electronics:'📱', food:'🍱', home:'🏠', others:'📦'
  };

  function renderProductCard(item, priority) {
    var card = document.createElement('div');
    card.className = 'product-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');

    var catKey = (item.category || 'others').toLowerCase();
    var emoji  = CAT_EMOJI[catKey] || '📦';
    var name   = item.display_name || item.name || '';
    var count  = item.vendor_count || 0;
    var price  = item.min_price;
    var imgUrl = item.image_url;

    var imgZone = document.createElement('div');
    imgZone.className = 'pc-image';

    if (imgUrl && typeof imgUrl === 'string' && imgUrl.startsWith('https://')) {
      var shimmer = document.createElement('div');
      shimmer.className = 'pc-image-shimmer';
      imgZone.appendChild(shimmer);
      var img = document.createElement('img');
      img.alt = name;
      img.setAttribute('data-loading', '1');
      img.loading      = priority ? 'eager' : 'lazy';
      img.decoding     = 'async';
      if (priority) img.fetchPriority = 'high';
      img.onload = function () {
        img.removeAttribute('data-loading');
        if (shimmer.parentNode) shimmer.parentNode.removeChild(shimmer);
      };
      img.onerror = function () {
        imgZone.innerHTML = '<div class="pc-image-placeholder">' + emoji + '<span>' + escHtml((item.category || 'product').toUpperCase()) + '</span></div>';
      };
      img.src = imgTransform(imgUrl, 400, 75);
      imgZone.appendChild(img);
    } else {
      imgZone.innerHTML = '<div class="pc-image-placeholder">' + emoji + '<span>' + escHtml((item.category || 'product').toUpperCase()) + '</span></div>';
    }

    var body = document.createElement('div');
    body.className = 'pc-body';

    if (item.category) {
      var catEl = document.createElement('div');
      catEl.className = 'pc-category';
      catEl.textContent = item.category.toUpperCase();
      body.appendChild(catEl);
    }

    var nameEl = document.createElement('div');
    nameEl.className = 'pc-name';
    nameEl.textContent = name;
    body.appendChild(nameEl);

    var footer = document.createElement('div');
    footer.className = 'pc-footer';
    var priceEl = document.createElement('div');
    priceEl.className = 'pc-price';
    if (price !== undefined && price !== null) {
      priceEl.textContent = (count > 1 ? 'from ' : '') + fmt(price);
    }
    footer.appendChild(priceEl);
    var storeEl = document.createElement('div');
    storeEl.className = 'pc-stores';
    storeEl.textContent = count === 1 ? '1 store' : count > 1 ? count + ' stores' : 'New';
    footer.appendChild(storeEl);
    body.appendChild(footer);

    card.appendChild(imgZone);
    card.appendChild(body);

    function open() { openProduct(item); }
    card.addEventListener('touchstart', function () { _prefetchProduct(item); }, { passive: true });
    card.addEventListener('click', open);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    return card;
  }

  // ── Render vendor card (product detail) ───────────────────────────────────
  function renderVendorCard(listing, profile, isBest) {
    var card = document.createElement('div');
    card.className = 'vendor-card' + (isBest ? ' best-price' : '');

    var storeName = (profile && (profile.business_name || profile.name)) || 'QuickShop Vendor';
    var tagline   = (profile && profile.tagline) || '';
    var initial   = storeName.charAt(0).toUpperCase();
    var storeUrl  = '/?store=' + encodeURIComponent(listing.vendor_store_id) +
      (listing.local_product_id ? '&pid=' + encodeURIComponent(listing.local_product_id) : '');

    // Avatar: show logo image if vendor has uploaded one, fall back to initial
    var avatarInner = (profile && profile.avatar_url &&
      typeof profile.avatar_url === 'string' &&
      profile.avatar_url.startsWith('https://'))
      ? '<img src="' + imgTransform(profile.avatar_url, 80, 85) + '" alt="' + escHtml(storeName) + '" loading="lazy">'
      : escHtml(initial);

    card.innerHTML =
      '<div class="vc-row">' +
        '<div class="vc-avatar">' + avatarInner + '</div>' +
        '<div class="vc-info">' +
          '<div class="vc-store">'   + escHtml(storeName) + '</div>' +
          (tagline ? '<div class="vc-tagline">' + escHtml(tagline) + '</div>' : '') +
          (isBest  ? '<div class="vc-best-badge">Best price</div>' : '') +
        '</div>' +
        '<div class="vc-price">' + fmt(listing.price) + '</div>' +
      '</div>' +
      '<a class="vc-cta" href="' + storeUrl + '">View in Store →</a>';

    return card;
  }

  // ── Render Store Directory Card (SDC) ─────────────────────────────────────
  // Used for both category stores and the all-stores directory.
  // thumbnails: up to 3 https image URLs from the store's products.
  function renderStoreDirectoryCard(profile, productCount, thumbnails) {
    var card = document.createElement('a');
    card.className = 'sdc';
    var storeName = (profile.business_name || profile.name) || 'QuickShop Vendor';
    var initial   = storeName.charAt(0).toUpperCase();
    card.href = '/?store=' + encodeURIComponent(profile.id);

    // Header
    var header = document.createElement('div');
    header.className = 'sdc-header';

    var avatarEl = document.createElement('div');
    avatarEl.className = 'sdc-avatar';
    if (profile.avatar_url && typeof profile.avatar_url === 'string' && profile.avatar_url.startsWith('https://')) {
      var avImg = document.createElement('img');
      avImg.src = imgTransform(profile.avatar_url, 80, 85); avImg.alt = storeName;
      avatarEl.appendChild(avImg);
    } else {
      avatarEl.textContent = initial;
    }
    header.appendChild(avatarEl);

    var info = document.createElement('div'); info.className = 'sdc-info';
    var nameEl = document.createElement('div'); nameEl.className = 'sdc-name'; nameEl.textContent = storeName;
    info.appendChild(nameEl);
    if (profile.tagline) {
      var tagEl = document.createElement('div'); tagEl.className = 'sdc-tagline'; tagEl.textContent = profile.tagline;
      info.appendChild(tagEl);
    }
    var meta = document.createElement('div'); meta.className = 'sdc-meta';
    if (profile.location) {
      var loc = document.createElement('span'); loc.className = 'sdc-location'; loc.textContent = '📍 ' + profile.location;
      meta.appendChild(loc);
    }
    if (profile.delivery_available === true) {
      var del = document.createElement('span'); del.className = 'sdc-delivery'; del.textContent = '🚚 Delivers';
      meta.appendChild(del);
    }
    if (typeof productCount === 'number' && productCount > 0) {
      var cnt = document.createElement('span'); cnt.className = 'sdc-count'; cnt.textContent = productCount + ' product' + (productCount !== 1 ? 's' : '');
      meta.appendChild(cnt);
    }
    info.appendChild(meta);
    header.appendChild(info);

    var action = document.createElement('span'); action.className = 'sdc-action'; action.setAttribute('aria-hidden', 'true'); action.textContent = 'Browse →';
    header.appendChild(action);
    card.appendChild(header);

    // Thumbnail strip
    var imgs = (thumbnails || []).filter(function (u) {
      return typeof u === 'string' && u.startsWith('https://');
    }).slice(0, 3);

    if (imgs.length > 0 || productCount > 0) {
      var strip = document.createElement('div');
      strip.className = 'sdc-thumbs';
      if (imgs.length > 0) {
        imgs.forEach(function (url) {
          var cell = document.createElement('div'); cell.className = 'sdc-thumb';
          var tImg = document.createElement('img');
          tImg.src = imgTransform(url, 200, 70); tImg.alt = storeName + ' product'; tImg.loading = 'lazy'; tImg.decoding = 'async';
          tImg.onerror = function () { cell.innerHTML = '<div class="sdc-thumb-placeholder">📦</div>'; };
          cell.appendChild(tImg);
          strip.appendChild(cell);
        });
      } else {
        for (var pi = 0; pi < 3; pi++) {
          var cell = document.createElement('div'); cell.className = 'sdc-thumb';
          var ph = document.createElement('div'); ph.className = 'sdc-thumb-placeholder'; ph.textContent = '📦';
          cell.appendChild(ph); strip.appendChild(cell);
        }
      }
      card.appendChild(strip);
    }
    return card;
  }

  // ── Empty state ───────────────────────────────────────────────────────────
  function renderEmpty(container, title, body) {
    var el = document.createElement('div');
    el.className = 'empty-state';
    el.style.gridColumn = '1/-1';
    el.innerHTML =
      '<div class="es-icon">🔎</div>' +
      '<h3>' + escHtml(title) + '</h3>' +
      '<p>' + escHtml(body) + '</p>';

  }

  // ── LOAD STORES (unified, lazy) ───────────────────────────────────────────
  // categoryFilter: string (e.g. 'Fragrance') or null for all stores.
  // Called when the Stores tab is first opened for the current context.
  async function loadStores(categoryFilter) {
    if (!sb) return;
    renderStorePanelLoading();
    storesHeading.hidden = true;

    try {
      var queryBuilder = sb
        .from('public_catalog_profiles')
        .select('id, business_name, name, tagline, avatar_url, location, delivery_available, slug')
        .eq('is_active', true)
        .limit(50);
      if (categoryFilter) queryBuilder = queryBuilder.ilike('store_sector', categoryFilter);

      var res = await queryBuilder;
      var stores = res.data || [];

      var countMap = {}, thumbMap = {};
      if (stores.length > 0) {
        var ids = stores.map(function (s) { return s.id; });
        var prodRes = await sb
          .from('qs_vendor_listings')
          .select('vendor_store_id, image_url')
          .in('vendor_store_id', ids);
        if (prodRes.data) {
          prodRes.data.forEach(function (r) {
            countMap[r.vendor_store_id] = (countMap[r.vendor_store_id] || 0) + 1;
            if (r.image_url && typeof r.image_url === 'string' && r.image_url.startsWith('https://')) {
              if (!thumbMap[r.vendor_store_id]) thumbMap[r.vendor_store_id] = [];
              if (thumbMap[r.vendor_store_id].length < 3) thumbMap[r.vendor_store_id].push(r.image_url);
            }
          });
        }
      }

      // For "all stores" mode, exclude stores with no listings
      if (!categoryFilter) {
        stores = stores.filter(function (s) { return (countMap[s.id] || 0) > 0; });
      }

      // Sort: most products first, completeness tiebreaker
      stores.sort(function (a, b) {
        var ca = countMap[a.id] || 0, cb = countMap[b.id] || 0;
        if (cb !== ca) return cb - ca;
        var sa = (a.avatar_url?1:0) + (a.tagline?1:0) + (a.location?1:0);
        var sb2= (b.avatar_url?1:0) + (b.tagline?1:0) + (b.location?1:0);
        return sb2 - sa;
      });

      var count = stores.length;

      // Heading
      if (count === 0) {
        storesHeading.innerHTML = categoryFilter
          ? 'No stores selling <strong>' + escHtml(categoryFilter) + '</strong> yet'
          : 'No active stores yet';
      } else {
        storesHeading.innerHTML = categoryFilter
          ? '<strong>' + count + ' store' + (count !== 1 ? 's' : '') + '</strong> selling ' + escHtml(categoryFilter)
          : '<strong>' + count + ' active store' + (count !== 1 ? 's' : '') + '</strong> on QuickShop';
      }
      storesHeading.hidden = false;

      storesGrid.innerHTML = '';
      if (!count) {
        var emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-state';
        emptyDiv.innerHTML =
          '<div class="es-icon">🏪</div>' +
          '<h3>No stores yet</h3>' +
          '<p>' + (categoryFilter ? 'No vendor sells ' + escHtml(categoryFilter) + ' yet.' : 'Be the first to list on QuickShop.') + '</p>';
        storesGrid.appendChild(emptyDiv);
        return;
      }

      stores.forEach(function (profile) {
        storesGrid.appendChild(
          renderStoreDirectoryCard(profile, countMap[profile.id] || 0, thumbMap[profile.id] || [])
        );
      });

    } catch (e) {
      console.error('[loadStores]', e);
      storesGrid.innerHTML =
        '<div class="empty-state"><div class="es-icon">⚠️</div>' +
        '<h3>Failed to load</h3><p>Please refresh and try again.</p></div>';
      storesHeading.hidden = true;
    }
  }

  // ── SEARCH ────────────────────────────────────────────────────────────────
  async function runSearch(query) {
    if (!sb) return;
    var seq = ++_navSeq;
    _mode         = 'search';
    _lastQuery    = query;
    _storesLoaded = false;
    _storesFetcher = function () { loadStores(null); };

    var params = getParams();
    params.set('q', query); params.delete('product'); params.delete('cat'); params.delete('view');
    navigate(params, false);

    setTabLabels('Stores');
    document.querySelectorAll('.cat-tile').forEach(function (t) { t.classList.remove('active'); });

    // Immediate skeleton feedback
    productsGrid.innerHTML = '';
    renderSkeletonGrid(productsGrid, 8);
    productsHeading.innerHTML = 'Searching for <strong>"' + escHtml(query) + '"</strong>…';
    productsHeading.hidden = false;
    loadMoreBtn.hidden = true;

    showState('main');
    switchTab('products');

    try {
      var res = await sb.rpc('qs_find_canonical', { p_name: query, p_threshold: 0.25 });
      if (seq !== _navSeq) return;
      var data = res.data || [];

      if (data.length === 0) {
        productsHeading.innerHTML = 'No results for <strong>"' + escHtml(query) + '"</strong>';
        productsGrid.innerHTML = '';
        renderEmpty(productsGrid, 'Nothing found', 'Try a different spelling, or browse a category.');
        return;
      }

      // qs_find_canonical now returns vendor_count, min_price, image_url directly.
      // No follow-up queries needed — data is fully populated from the RPC.

      productsHeading.innerHTML =
        'Found <strong>' + data.length + ' product' + (data.length !== 1 ? 's' : '') + '</strong>' +
        ' matching "' + escHtml(query) + '"';
      productsGrid.innerHTML = '';
      data.forEach(function (item, i) { productsGrid.appendChild(renderProductCard(item, i < 4)); });

    } catch (e) {
      console.error('[search] error', e);
      productsHeading.textContent = 'Something went wrong. Please try again.';
      productsGrid.innerHTML = '';
    }
  }

  // ── BROWSE CATEGORY ───────────────────────────────────────────────────────
  async function browseCategory(cat, append) {
    if (!sb) return;
    var seq = ++_navSeq;

    if (!append) {
      _mode         = 'category';
      _catName      = cat;
      _catOffset    = 0;
      _storesLoaded = false;
      _storesFetcher = function () { loadStores(cat); };

      var params = getParams();
      params.set('cat', cat); params.delete('q'); params.delete('product'); params.delete('view');
      navigate(params, false);

      setTabLabels('Stores');
      input.value = ''; clearBtn.style.display = 'none';

      document.querySelectorAll('.cat-tile').forEach(function (t) {
        t.classList.toggle('active', t.dataset.cat === cat);
      });

      productsHeading.hidden = true;
      loadMoreBtn.hidden = true;

      storesHeading.hidden = true;
      storesGrid.innerHTML = '';

      // In-session memo: serve first page instantly, skip network + skeleton
      var _memoKey = 'cat:' + cat.toLowerCase();
      var _memoHit = _memo.get(_memoKey);
      if (_memoHit) {
        productsGrid.innerHTML = '';
        productsHeading.innerHTML =
          '<strong>' + escHtml(cat) + '</strong> — ' +
          _memoHit.length + ' product' + (_memoHit.length !== 1 ? 's' : '');
        productsHeading.hidden = false;
        _memoHit.forEach(function (item, i) { productsGrid.appendChild(renderProductCard(item, i < 4)); });
        _catOffset = _memoHit.length;
        loadMoreBtn.hidden = true;
        showState('main');
        switchTab('products');
        return;
      }

      productsGrid.innerHTML = '';
      renderSkeletonGrid(productsGrid, _CAT_PAGE);

      showState('main');
      switchTab('products');
    }

    try {
      var canonRes = await sb
        .from('qs_market_products')
        .select('id, display_name, slug, category, image_url, vendor_count, min_price')
        .not('image_url', 'is', null)
        .ilike('category', cat)
        .order('vendor_count', { ascending: false, nullsFirst: false })
        .order('created_at', { ascending: false })
        .range(_catOffset, _catOffset + _CAT_PAGE - 1);

      if (seq !== _navSeq) return;

      var canonData = canonRes.data || [];
      _catHasMore = canonData.length === _CAT_PAGE;

      if (canonData.length > 0) {
        canonData.sort(function (a, b) {
          var ai = (a.image_url && a.image_url.startsWith('https://')) ? 0 : 1;
          var bi = (b.image_url && b.image_url.startsWith('https://')) ? 0 : 1;
          if (ai !== bi) return ai - bi;
          return (b.vendor_count || 0) - (a.vendor_count || 0);
        });
        if (!append) _memo.set('cat:' + cat.toLowerCase(), canonData);
      }

      if (!append) productsGrid.innerHTML = '';
      if (append) productsGrid.querySelectorAll('.lm-skel').forEach(function (el) { el.remove(); });

      var totalShown = _catOffset + canonData.length;

      if (canonData.length === 0 && !append) {
        productsHeading.innerHTML = '<strong>' + escHtml(cat) + '</strong> — no products yet';
        productsHeading.hidden = false;
        renderEmpty(productsGrid, 'Empty category', 'Be the first vendor to add products here.');
        loadMoreBtn.hidden = true;
        return;
      }

      productsHeading.innerHTML =
        '<strong>' + escHtml(cat) + '</strong> — ' +
        totalShown + (_catHasMore ? '+' : '') + ' product' + (totalShown !== 1 ? 's' : '');
      productsHeading.hidden = false;

      canonData.forEach(function (item, i) { productsGrid.appendChild(renderProductCard(item, !append && i < 4)); });
      _catOffset += canonData.length;

      // Load more button
      if (_catHasMore) {
        loadMoreBtn.textContent = 'View all ' + cat + ' products →';
        loadMoreBtn.hidden    = false;
        loadMoreBtn.disabled  = false;
      } else {
        loadMoreBtn.hidden = true;
      }

    } catch (e) {
      if (seq !== _navSeq) return;
      console.error('[browseCategory]', e);
      if (!append) {
        productsGrid.innerHTML = '';
        var _errDiv = document.createElement('div');
        _errDiv.className = 'empty-state';
        _errDiv.innerHTML = '<div class="es-icon">⚠️</div><h3>Couldn\'t load products</h3><p>Check your connection.</p>';
        var _retryBtn = document.createElement('button');
        _retryBtn.className = 'qs-retry-btn';
        _retryBtn.textContent = 'Retry';
        _retryBtn.addEventListener('click', function () { browseCategory(cat); });
        _errDiv.appendChild(_retryBtn);
        productsGrid.appendChild(_errDiv);
        productsHeading.hidden = true;
      } else {
        productsGrid.querySelectorAll('.lm-skel').forEach(function (el) { el.remove(); });
        loadMoreBtn.textContent = 'Retry';
        loadMoreBtn.disabled = false;
      }
    }
  }

  // ── PRODUCT DETAIL ────────────────────────────────────────────────────────
  async function openProduct(item) {
    if (!sb) return;
    var seq = ++_navSeq;   // capture before any await
    _currentProduct = item;

    var params = getParams();
    params.set('product', item.slug); params.delete('q'); params.delete('cat');
    navigate(params, false);

    // Save scroll position for restoration on goBack()
    _scrollY = window.scrollY;

    // ── Optimistic render: show detail immediately from card data ─────────
    // The user sees name + image + partial meta the instant they tap —
    // no spinner, no blank wait.  Vendor cards skeleton in while data loads.
    var _backCtx = (_mode === 'category' && _catName) ? _catName
                 : (_mode === 'search'   && _lastQuery) ? 'Search'
                 : 'Browse';
    detailBack.textContent = '← ' + _backCtx;
    detailName.textContent = item.display_name || item.name || '';

    // Image — browser already decoded the card thumbnail; request 800px for detail
    detailImageWrap.innerHTML = '';
    detailImageWrap.hidden = true;
    if (item.image_url && typeof item.image_url === 'string' && item.image_url.startsWith('https://')) {
      var dShimmer = document.createElement('div');
      dShimmer.className = 'pc-image-shimmer';
      dShimmer.style.cssText = 'position:absolute;inset:0;z-index:1;';
      detailImageWrap.appendChild(dShimmer);
      var dImg = document.createElement('img');
      dImg.src = imgTransform(item.image_url, 800, 82);
      dImg.alt = item.display_name || '';
      dImg.setAttribute('data-loading', '1');
      dImg.onload = function () {
        dImg.removeAttribute('data-loading');
        if (dShimmer.parentNode) dShimmer.parentNode.removeChild(dShimmer);
      };
      dImg.onerror = function () {
        detailImageWrap.hidden = true;
        if (dShimmer.parentNode) dShimmer.parentNode.removeChild(dShimmer);
      };
      detailImageWrap.appendChild(dImg);
      detailImageWrap.hidden = false;
    }

    // Partial meta from card data while precise listing data loads
    var _cardCount = item.vendor_count || 0;
    if (_cardCount > 0 && item.min_price != null) {
      detailMeta.innerHTML =
        '<span class="dm-stores">' + _cardCount + ' store' + (_cardCount !== 1 ? 's' : '') + '</span>' +
        ' · <span class="dm-price">' + fmt(item.min_price) + (item.max_price && item.max_price !== item.min_price ? ' – ' + fmt(item.max_price) : '') + '</span>';
    } else {
      detailMeta.textContent = '';
    }

    // Skeleton vendor cards — number matches card's vendor_count so layout doesn't jump
    detailVLabel.textContent = _cardCount > 0 ? 'Where to buy' : '';
    vendorList.innerHTML = '';
    var _skelCount = Math.min(Math.max(_cardCount, 1), 3);
    for (var _vs = 0; _vs < _skelCount; _vs++) vendorList.appendChild(renderSkeletonVendorCard());

    showState('detail');   // animate in immediately — no spinner shown

    // ── Async: fetch precise vendor data ─────────────────────────────────
    _prefetchProduct(item);   // no-op if already warmed by touchstart

    try {
      var listRes = await _prefetchCache.get(item.id);
      if (seq !== _navSeq) return;  // user navigated away — discard

      var listings  = listRes.data || [];
      var vendorIds = listings.map(function (l) { return l.vendor_store_id; });
      var profileMap = {};

      if (vendorIds.length > 0) {
        var profRes = await sb.from('public_catalog_profiles')
          .select('id, business_name, name, tagline, avatar_url')
          .in('id', vendorIds);
        if (seq !== _navSeq) return;  // check again after second await
        if (profRes.data) profRes.data.forEach(function (p) { profileMap[p.id] = p; });
      }

      // Update meta with precise listing data
      var storeCount = listings.length;
      var minPrice   = storeCount ? listings[0].price : null;
      var maxPrice   = storeCount ? listings[storeCount - 1].price : null;

      if (storeCount === 0) {
        detailMeta.textContent = 'No vendors currently selling this product.';
      } else if (minPrice === maxPrice) {
        detailMeta.innerHTML =
          '<span class="dm-stores">' + storeCount + ' store' + (storeCount !== 1 ? 's' : '') + '</span>' +
          ' · <span class="dm-price">' + fmt(minPrice) + '</span>';
      } else {
        detailMeta.innerHTML =
          '<span class="dm-stores">' + storeCount + ' store' + (storeCount !== 1 ? 's' : '') + '</span>' +
          ' · <span class="dm-price">' + fmt(minPrice) + ' – ' + fmt(maxPrice) + '</span>';
      }

      // Replace skeleton vendor cards with real data
      detailVLabel.textContent = storeCount === 0 ? '' : 'Where to buy';
      vendorList.innerHTML = '';
      if (storeCount === 0) {
        vendorList.innerHTML =
          '<div class="empty-state"><div class="es-icon">📦</div>' +
          '<h3>Not available yet</h3>' +
          '<p>No vendor on QuickShop is selling this right now.</p></div>';
      } else {
        listings.forEach(function (listing, idx) {
          vendorList.appendChild(
            renderVendorCard(listing, profileMap[listing.vendor_store_id] || null, idx === 0 && storeCount > 1)
          );
        });
      }

      injectProductSchema(item, listings, profileMap);

    } catch (e) {
      if (seq !== _navSeq) return;
      console.error('[product detail]', e);
      vendorList.innerHTML =
        '<div class="empty-state"><div class="es-icon">⚠️</div>' +
        '<h3>Couldn\'t load vendor info</h3>' +
        '<p>Check your connection.</p></div>';
    }
  }

  // ── JSON-LD product schema ────────────────────────────────────────────────
  function injectProductSchema(canonical, listings, profileMap) {
    var old = document.getElementById('qs-product-ld'); if (old) old.remove();
    if (!listings.length) return;
    var offers = listings
      .filter(function (l) { return l.price !== null && l.price !== undefined; })
      .map(function (l) {
        var p = profileMap[l.vendor_store_id] || {};
        return { '@type':'Offer', 'price':l.price, 'priceCurrency':'NGN',
          'availability':'https://schema.org/InStock',
          'seller':{ '@type':'Organization', 'name': p.business_name || p.name || 'QuickShop Vendor' } };
      });
    if (!offers.length) return;
    var script = document.createElement('script');
    script.type = 'application/ld+json'; script.id = 'qs-product-ld';
    script.textContent = JSON.stringify({
      '@context':'https://schema.org', '@type':'Product',
      'name': canonical.display_name, 'offers': offers
    });
    document.head.appendChild(script);
  }

  // ── WEIGHTED SHUFFLE ──────────────────────────────────────────────────────
  // Score products by completeness, shuffle randomly within each bucket.
  function weightedShuffle(items) {
    function score(item) {
      var hasImage  = !!(item.image_url && item.image_url.startsWith('https://'));
      var hasVendor = (item.vendor_count || 0) >= 1;
      var hasPrice  = item.min_price !== undefined && item.min_price !== null;
      if (hasImage && hasVendor && hasPrice) return 3;
      var s = 0;
      if (hasImage) s += 2;
      if (hasPrice) s += 1;
      return Math.min(s, 2);
    }
    var buckets = { 3:[], 2:[], 1:[], 0:[] };
    items.forEach(function (item) { buckets[score(item)].push(item); });
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }
    return shuffle(buckets[3])
      .concat(shuffle(buckets[2]))
      .concat(shuffle(buckets[1]))
      .concat(shuffle(buckets[0]));
  }

  // ── LOAD RECENT PRODUCTS ──────────────────────────────────────────────────
  async function loadRecent(append) {
    if (!sb) return;
    var seq = ++_navSeq;
    try {
      var from = _recentOffset;
      var to   = from + _RECENT_PAGE - 1;

      // In-session memo: first page only (append loads bypass cache)
      if (!append) {
        var _memoHome = _memo.get('home');
        if (_memoHome) {
          productsGrid.innerHTML = '';
          _memoHome.forEach(function (item, i) { productsGrid.appendChild(renderProductCard(item, i < 4)); });
          _recentOffset = _memoHome.length;
          if (_memoHome.length < _RECENT_PAGE) {
            loadMoreBtn.hidden = true;
          } else {
            loadMoreBtn.textContent = 'Load more products';
            loadMoreBtn.hidden    = false;
            loadMoreBtn.disabled  = false;
          }
          return;
        }
      }

      var res = await sb
        .from('qs_market_products')
        .select('id, display_name, slug, category, image_url, vendor_count, min_price')
        .not('image_url', 'is', null)
        .order('created_at', { ascending: false })
        .range(from, to);

      if (seq !== _navSeq) return;

      if (!res.data || !res.data.length) {
        if (!append) {
          productsGrid.innerHTML = '';
          renderEmpty(productsGrid, 'Nothing here yet', 'Products will appear as vendors list on QuickShop.');
        } else {
          productsGrid.querySelectorAll('.lm-skel').forEach(function (el) { el.remove(); });
          loadMoreBtn.hidden = true;
        }
        return;
      }

      var ordered = weightedShuffle(res.data);
      if (!append) {
        productsGrid.innerHTML = '';
        _memo.set('home', ordered);
      }
      if (append) productsGrid.querySelectorAll('.lm-skel').forEach(function (el) { el.remove(); });
      ordered.forEach(function (item, i) { productsGrid.appendChild(renderProductCard(item, !append && i < 4)); });

      _recentOffset += res.data.length;

      if (res.data.length < _RECENT_PAGE) {
        loadMoreBtn.hidden = true;
      } else {
        loadMoreBtn.textContent = 'Load more products';
        loadMoreBtn.hidden    = false;
        loadMoreBtn.disabled  = false;
      }

    } catch (e) {
      if (seq !== _navSeq) return;
      console.error('[loadRecent]', e);
      if (!append) {
        productsGrid.innerHTML = '';
        var errDiv = document.createElement('div');
        errDiv.className = 'empty-state';
        errDiv.innerHTML = '<div class="es-icon">⚠️</div><h3>Couldn\'t load products</h3><p>Check your connection.</p>';
        var retryBtn = document.createElement('button');
        retryBtn.className = 'qs-retry-btn';
        retryBtn.textContent = 'Retry';
        retryBtn.addEventListener('click', function () { loadHome(); });
        errDiv.appendChild(retryBtn);
        productsGrid.appendChild(errDiv);
      } else {
        productsGrid.querySelectorAll('.lm-skel').forEach(function (el) { el.remove(); });
        loadMoreBtn.textContent = 'Retry';
        loadMoreBtn.disabled = false;
      }
    }
  }

  // ── LOAD MORE (products panel) ────────────────────────────────────────────
  loadMoreBtn.addEventListener('click', function () {
    loadMoreBtn.disabled    = true;
    loadMoreBtn.textContent = 'Loading…';

    // Immediate visual response: append 8 skeleton cards to the grid.
    // Marked with .lm-skel so the fetch callback can remove them cleanly
    // before inserting real cards — avoids a blank wait with no feedback.
    var _frag = document.createDocumentFragment();
    for (var _s = 0; _s < 8; _s++) {
      var _sc = document.createElement('div');
      _sc.className = 'skel-card lm-skel';
      var _si = document.createElement('div'); _si.className = 'skel-card-img skel';
      var _sb = document.createElement('div'); _sb.className = 'skel-card-body';
      _sb.innerHTML =
        '<div class="skel" style="height:10px;width:45%"></div>' +
        '<div class="skel" style="height:14px;width:85%"></div>' +
        '<div class="skel" style="height:12px;width:55%"></div>';
      _sc.appendChild(_si); _sc.appendChild(_sb);
      _frag.appendChild(_sc);
    }
    productsGrid.appendChild(_frag);

    if (_mode === 'home') {
      loadRecent(true);
    } else if (_mode === 'category') {
      browseCategory(_catName, true);
    }
  });

  // ── BACK from product detail ──────────────────────────────────────────────
  function goBack() {
    _currentProduct = null;
    var old = document.getElementById('qs-product-ld'); if (old) old.remove();
    var params = getParams(); params.delete('product');
    if (_mode === 'search' && _lastQuery) params.set('q', _lastQuery);
    else if (_mode === 'category' && _catName) params.set('cat', _catName);
    navigate(params, false);
    showState('main');
    // Restore scroll — rAF ensures the main panel is visible before scrolling
    requestAnimationFrame(function () { window.scrollTo(0, _scrollY); });
  }

  detailBack.addEventListener('click', goBack);

  // ── TAB CLICK EVENTS ──────────────────────────────────────────────────────
  tabProducts.addEventListener('click', function () { switchTab('products'); });
  tabStores.addEventListener('click',   function () { switchTab('stores'); });

  // ── CATEGORY TILE CLICKS ──────────────────────────────────────────────────
  catGrid.addEventListener('click', function (e) {
    var tile = e.target.closest('.cat-tile');
    if (!tile) return;
    e.preventDefault();
    var cat = tile.dataset.cat;
    if (cat === '__stores__') browseAllStores();
    else if (cat)             browseCategory(cat);
  });

  // ── SEARCH INPUT ──────────────────────────────────────────────────────────
  input.addEventListener('input', function () {
    var val = input.value.trim();
    clearBtn.style.display = val ? 'block' : 'none';
    clearTimeout(_debounceTimer);
    if (!val) {
      document.querySelectorAll('.cat-tile').forEach(function (t) { t.classList.remove('active'); });
      navigate(new URLSearchParams(), true);
      loadHome();
      return;
    }
    if (val.length < 2) return;
    _debounceTimer = setTimeout(function () { runSearch(val); }, 420);
  });

  clearBtn.addEventListener('click', function () {
    input.value = ''; clearBtn.style.display = 'none'; input.focus();
    document.querySelectorAll('.cat-tile').forEach(function (t) { t.classList.remove('active'); });
    navigate(new URLSearchParams(), true);
    _currentProduct = null;
    loadHome();
  });

  // ── ROUTER ────────────────────────────────────────────────────────────────
  window.addEventListener('popstate', function () { routeFromURL(); });

  function routeFromURL() {
    var params  = getParams();
    var q       = params.get('q');
    var product = params.get('product');
    var cat     = params.get('cat');
    var view    = params.get('view');
    updateSEO(params);
    if (product)               loadProductBySlug(product);
    else if (q)                { input.value = q; clearBtn.style.display = 'block'; runSearch(q); }
    else if (cat)              browseCategory(cat);
    else if (view === 'stores') browseAllStores();
    else                       loadHome();
  }

  // ── INIT ──────────────────────────────────────────────────────────────────
  routeFromURL();

})();
</script>
</body>
</html>
