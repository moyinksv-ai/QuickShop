name: Regression guards

on:
  push:
  pull_request:

jobs:
  regression-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression guard tests
        run: node --test tests/regression-guards.test.js
